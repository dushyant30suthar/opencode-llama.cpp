# QWEN3.8-27B via ggml-org Q4_K_M + separate MTP Q4_0 head (draft-mtp).
# Model dropped 2026-08-13; hybrid GDN (16 full-attn + 48 linear) like Qwen3.6.
# MTP drafted with spec-draft-model pointing at ggml-org's separate head file;
# draft-mtp needs -np 1 (parallel=1). Samplers = Qwen "precise coding" card.
# MEASURED 2026-08-14 (MTP active, tensor split, q8 KV): LOAD ceiling is
# 241664 (15.8 GiB/GPU) but generation OOMs at ~465MiB free — the CUDA
# matmul workspace needs headroom. 196608 loads AND generates cleanly
# (14.7 GiB/GPU, ~1.5 GiB free, 85 t/s with MTP). This is the real usable
# ceiling; ~3.6x the vLLM NVFP4 ~54k usable.
[ggml-org/Qwen3.8-27B-GGUF]
# RAM: no mmap page-cache retention (community 2x5060Ti: 16.3->1.85GiB, decode unchanged)
load-mode = none
model = /home/dushyant30suthar/.lmstudio/models/ggml-org/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf
spec-draft-model = /home/dushyant30suthar/.lmstudio/models/ggml-org/Qwen3.8-27B-GGUF/mtp-Qwen3.8-27B-Q4_0.gguf
ctx-size = 196608
split-mode = tensor
gpu-layers = 99
flash-attn = on
# KV stays q8_0/q8_0 (no change). At ctx 196608 (measured working ceiling,
# 85 t/s, ~1.5 GiB free) K=f16/V=q8 needs +1.5 GiB/GPU over q8 -> free drops
# BELOW the ~465 MiB matmul-workspace generation floor => OOM mid-decode.
# K=f16 only pays off (deep-decode dequant) at <=165K ctx, which we are NOT
# taking. q8_0 is the near-lossless KV that fits 192K with real headroom.
cache-type-k = q8_0
cache-type-v = q8_0
# Checkpoints (Qwen3.6 prod): GDN recurrent state can't rewind, so snapshot
# densely to cut mid-conversation re-prefill on divergence (-13..30% stalls).
# Each slot ~150 MiB + ~3.9 KiB/token. If reload presses VRAM/RAM (free <
# ~465 MiB floor), fall back: checkpoint-min-step 8192 + ctx-checkpoints 32.
checkpoint-min-step = 4096
ctx-checkpoints = 40
jinja = true
parallel = 1
spec-type = draft-mtp
# 2026-08-15: tested n=5 as the point after n4 (48 t/s, mean-len 3.46, which
# beat n3=40 t/s, 2.85). n5 landed below the n4 baseline, so the peak on this
# hardware is 4 — reverted to 4. Ladder: n3=40, n4=48 (peak), n5<48.
spec-draft-n-max = 4
# Qwen3.8 official Thinking-Mode card (model README, 2026-08-14):
#   temperature=1.0, top_p=0.95, top_k=20, min_p=0.0,
#   presence_penalty=0.0, repetition_penalty=1.0
# (Qwen3.8 dropped the Qwen3.6-era "precise coding temp 0.6" tier — the card
#  lists only Thinking=1.0 and Instruct=0.7, and Qwen benchmarks its own
#  agentic coding at temp 1.0. Tradeoff: the flatter distribution at 1.0
#  lowers MTP draft acceptance vs 0.6.)
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0

# DFLASH2 VARIANT of the same weights — z-lab/Qwen3.8-27B-DFlash2 drafter.
# Target is a HARD LINK (same inode) of the main ggml-org Q4_K_M; the folder is
# separate because discovery flags a model vision-capable iff an mmproj sits
# beside it, and one section owns one model file — the MTP and DFlash2 drafts
# cannot share a section, so the link gives each its own entry.
# DFlash2 (arch DFlash2DraftModel, block-diffusion w/ candidate selector + two-
# tap conv) needs the llama.cpp build at llama.cpp-dflash2 (commit 5ecbe1ac1
# "support DFlash2") — the default llama.cpp/build binary is too old. Auto-
# detected via dflash.selector_top_k>0 in the draft GGUF; spec-type stays
# draft-dflash. block_size 8 -> spec-draft-n-max 7 (clamped if set higher).
# Draft KV must be f16/bf16 — q8_0 collapses DFlash acceptance to ~0-2%
# (llama.cpp issue #25725, fixed by PR #25823). p-min 0.75 restores acceptance
# (issue #25792); n-max tuned down to 3 (acceptance peaks at 2-4 per #25792
# and the Qwen3-Coder-Next gist).
# MUST use split-mode LAYER, not tensor: the draft has no output.weight and
# shares the target's lm_head; under tensor-split the lm_head is row-split and
# the DFlash2 selector's TOP_K on the split logits aborts in the meta backend
# (ggml-backend-meta.cpp handle_per_row). Layer keeps output.weight whole on
# main_gpu so the draft logits are unsplit. ctx must be reduced (65536) to fit:
# layer-split 27B at 196608 needs ~20 GiB/GPU. Draft pinned to CUDA0 (same GPU
# as main_gpu output.weight). Spec-draft-device arg is required (see above).
# NOTE: draft acceptance observed ~0.09 (block 8) — tuning concern, matches the
# upstream-known DFlash-on-multi-GPU quality issues (beellama.cpp commit 3706706).
[ggml-org/Qwen3.8-27B-DFlash2-nospec]
model = /home/dushyant30suthar/.lmstudio/models/ggml-org/Qwen3.8-27B-DFlash2/Qwen3.8-27B-Q4_K_M.gguf
ctx-size = 65536
split-mode = layer
gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
parallel = 1
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

[ggml-org/Qwen3.8-27B-DFlash2]
# RAM: no mmap page-cache retention (community 2x5060Ti: 16.3->1.85GiB, decode unchanged)
load-mode = none
model = /home/dushyant30suthar/.lmstudio/models/ggml-org/Qwen3.8-27B-DFlash2/Qwen3.8-27B-Q4_K_M.gguf
spec-draft-model = /home/dushyant30suthar/.lmstudio/models/z-lab/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q8_0.gguf
ctx-size = 176640
split-mode = tensor
fit = off
gpu-layers = 99
tensor-split = 0.51,0.49
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
checkpoint-min-step = 4096
ctx-checkpoints = 40
jinja = true
parallel = 1
# DFlash2 graph tensors can't be row-split (GGML_ASSERT src_ss[0].axis !=
# SPLIT_AXIS_0): the draft inherits the target's split-mode=tensor across both
# GPUs. Pin the 1.14GB draft to CUDA0 so it is never split.
spec-type = draft-dflash,ngram-mod
