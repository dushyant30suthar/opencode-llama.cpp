# MUSE GLIMMER 30B (Meta, dense 29.6B) — 2026-08-10, DFlash spec-decode path.
# Target: 2x RTX 5060 Ti 16GB, split-mode = tensor (0.5/0.5).
# DFlash drafter (dflash-kquant.gguf) is distilled against META'S kquant builds,
# NOT Unsloth GGUF — that mismatch breaks pairing, so use the meta-models files.
# kquant-dynamic (19.65GB) is the build for 32GB VRAM: 17gb is the 24GB-card
# build, and dynamic gives better quality on our 2x16GB tensor pair.
# Glimmer KV is tiny (GQA 16:1, 2 KV heads k/v 128, 40.5KB/tok across both
# GPUs) so long ctx is cheap. Measured 2026-08-11: KV@131072 ~5.3GB, card usage
# 13.97GB/16.3 = 2.3GB/GPU headroom ~= up to ~246k ctx, so 196608 is a safe rung.
# n-max 15 = block size 16 minus 1 anchor slot. Clamped above; no point lower
# for a block-diffusion drafter. First-call soak: watch acceptance in server log
# (spec_accept). Unknown on dual-5060Ti — sandbagged by RV5060=OK numbers?
