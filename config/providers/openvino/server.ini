# OpenVINO Model Server settings for opencode-localhost.
# Changing anything here restarts the server.
#
#   bin         path to ovms-serve. empty = look on $PATH
#               NOTE the wrapper, not bare 'ovms': ovms links libpython and
#               exits before main() unless LD_LIBRARY_PATH is already set
#   models-dir  where your OpenVINO IR model directories live. REQUIRED
#   model       which one to serve. empty = the only one, if there is only one
#               OVMS holds one model per process, so this is a real choice:
#               changing it and restarting is how you switch models
#   remote      point at ANOTHER machine's OVMS instead of running one here,
#               e.g. fedora.local:8100. When set, bin/models-dir/model/host/port
#               are ignored and nothing is started locally. Note stopping is not
#               possible on a remote: OVMS holds one model for the life of the
#               process and has no unload endpoint, so the only way to free that
#               GPU is on the machine that owns it
#   host        127.0.0.1 keeps it on this machine; 0.0.0.0 serves the LAN so
#               another machine can point at it. This is passed to OVMS as
#               --rest_bind_address, whose own default is 0.0.0.0 — so leaving
#               this at 127.0.0.1 is what actually makes it loopback-only
#   port        OVMS REST port
#   context     window to advertise to opencode. keep it under what the KV cache
#               can actually hold — going over returns an empty reply, not an
#               error, so too high looks like the model refusing to answer
#   api-key     leave empty for localhost-only
#
# CACHE TUNING IS NOT HERE. ovms-serve takes no flags for it — OVMS reads
# cache_size and cache_interval_multiplier from the servable's graph.pbtxt:
#   ~/.local/state/ovms/servables/<model>/graph.pbtxt
# (mirrored under servables/ next to this file). Editing cache-* anywhere in
# THIS file does nothing.
#
# What the current servable (Qwen3.5-4B-int4-ov) uses, and why:
#
#   cache_interval_multiplier = 1024  REQUIRED for long context on hybrid
#               DeltaNet models. OVMS checkpoints the whole fp32 recurrent
#               state every kv_block_size * this; the default of 8 makes those
#               snapshots dwarf the KV cache. 1024 matches the Qwen3.6-27B
#               servable on this box, which answers 90k prompts.
#   cache_size = 4  With the 4B (3.3GB int4) loaded, the box (30GB RAM, Arc
#               140T iGPU) sits at 12Gi free. KV math at u8: ~16KB/token
#               (8 of 32 layers are full attention), so 4GB of cache holds
#               ~262k tokens — the 65536 advertised here is ~a quarter of the
#               ceiling. 4 stays in step with the 27B servable so both models
#               can be hot on the same iGPU at once.
#
#   context = 65536  Measured on this box, 2026-09-14: 20k-token needle
#               retrieval in 15.7s, 40k-token needle retrieval in 41.9s,
#               README (~4k varied text) + image in 5.8s. All correct. The
#               window is real, not just advertised.
#
# Model choice: Qwen3.5-4B-int4-ov (OpenVINO/Qwen3.5-4B-int4-ov, 3.3GB) is the
# orchestrator — it reads photo notes (native vision tower) and launches
# subagents. It tops the 2026 local tool-calling evals (97.5% pass, best
# multi-tool). It replaced gemma-4-26b-a4b-it-int4-ov, which looped and hit
# iGPU allocation failures under load (see server.log 2026-09-14 13:45).
#
# Thinking: the plugin (opencode-localhost, commit 1ab0627) forces
# enable_thinking on for Qwen3 developer models but EXCLUDES this 4B.
# Measured on the same 6-line transcription: thinking off = 41 tokens, 5.8s,
# correct; thinking on = 1,718 tokens, 66.6s, correct but fixated on one
# ambiguous glyph ("llms" vs "lIms" re-examined ~15 times), and its length
# varies run-to-run (one run exceeded a 2048-token budget mid-thought). Not a
# loop — it terminates — but ~10x latency on trivial relay turns is the price.
#
# Sampling is per-request, so editing it takes effect on the next message.
# The values below are Qwen's published "precise coding" preset.

[server]
bin =~/.local/bin/ovms-serve
models-dir = ~/.lmstudio/models-ov
model = Qwen3.5-4B-int4-ov
remote =
host = 127.0.0.1
port = 8100
context = 65536
api-key =

[sampling]
temperature = 0.6
top_p = 0.95
top_k = 20