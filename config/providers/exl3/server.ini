# exllamav3 (TabbyAPI) settings for opencode-localhost.
# Changing anything here restarts the server.
#
#   bin        python with exllamav3 importable. REQUIRED
#              NOT the system python — this venv carries the local build.
#   tabby-dir  the tabbyAPI checkout (contains main.py). REQUIRED
#   config     OPTIONAL single-model override. Leave blank to use models/.
#              When set, that one YAML is served and models/ is ignored — an
#              escape hatch for a one-off config without adding it to models/.
#   models-dir where the EXL3 checkpoints live. TabbyAPI resolves the model from
#              each YAML's own model_dir; this is for the panel's listing
#   remote     point at ANOTHER machine's TabbyAPI, e.g. fedora.local:5000
#   host/port  must match the YAML's network section; used to reach, not bind
#   context    fallback window advertised when a YAML declares no max_seq_len
#
# MODEL SELECTION lives in models/, one TabbyAPI YAML per model:
#
#     ~/.config/opencode/providers/exl3/models/
#         Qwen3.6-27B-exl3-5.00bpw.yml     ~7% faster decode, +150k context
#         Qwen3.6-27B-exl3-6.00bpw.yml     closer to full precision (KLD
#                                          0.013 vs 0.035), slower, less context
#     Each file carries what was measured and what was not. Speed is measured;
#     output quality at working depth is not, for either.
#
# The panel lists them by their `model_name`; picking one relaunches TabbyAPI
# against that file. Unlike llama.cpp — whose models.ini is llama.cpp's own
# format, and whose router holds every model at once — TabbyAPI serves exactly
# one model per process, so selecting a model is a restart.
#
# That restart is load-bearing, not a limitation: exllamav3 does not return VRAM
# to the driver on unload. Measured 2026-08-01, an in-process swap back from
# 6.00bpw to 5.00bpw threw "Insufficient VRAM in split for model and cache" and
# left the server with NO model loaded and 29.2 GiB still allocated. Killing the
# process is what reclaims it — which is also why the YAMLs keep
# inline_model_loading off.
#
# Sampling is per-request. Values below are Qwen's "precise coding" preset.

[server]
bin = ~/Projects/exllamav3/venv/bin/python
tabby-dir = ~/Projects/tabbyAPI
config =
models-dir = ~/.lmstudio/models/turboderp
remote =
host = 0.0.0.0
port = 5000
context = 196608
api-key =

[sampling]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0
