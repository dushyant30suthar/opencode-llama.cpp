# Qwen3.6-27B EXL3 6.00bpw + DFlash drafter, SINGLE SLOT.
#
# The highest-fidelity weights this box holds (mean KLD 0.013 vs 5.00bpw's
# 0.035) paired with the strongest drafter, with concurrency spent to pay for
# both. One agent, as fast and as accurate as the hardware allows.
#
# BUDGET (2026-08-01 measurements: 2.14 GiB prefill transient, 1.0 GiB autosplit
# reserve, 144 MiB of gated-deltanet state per draft step per slot across the 48
# GDN layers). DFlash's block_size is 16, fixed in the drafter's config and read
# as native_draft_len at architecture/dflash.py:86 — it cannot be capped the way
# MTP's draft_num_tokens can, so the state cost is 17 steps = 2.39 GiB/slot
# against MTP's 0.70:
#
#     slots   GDN state   left for KV   context
#       4       9.56 G      -3.77 G     does not fit
#       2       4.78 G       1.01 G      52,887   below a real 49,791-token req
#       1       2.39 G       3.40 G     178,225   <- this file
#
# cache_size 131072 rather than the 178,225 ceiling: the margin here is thinner
# than on the 5.00bpw pairing (+2.84 GiB of weights), and a deep prefill takes
# 2.14 GiB the CUDA allocator then keeps rather than returning. Ladder up only
# behind a confirmed deep prefill — the 07-29 note has cache_size 360448 leaving
# 53 MiB free and OOMing everything.
#
# WHY ONE SLOT IS NOT MERELY A COMPROMISE. Measured decode by concurrency on
# this box: 1 job 76.2 t/s, 2 jobs 40.2 each, 4 jobs 15.1 each. Four agents each
# producing T tokens take T/15.1 concurrently but 4T/76.2 sequentially — the
# sequential path is faster in wall-clock, because one sequence already
# saturates the GPU. Queued conversations keep their cached prefix (page-hashed,
# refcounted), so waiting costs latency, not recompute: 0.5s to resume against
# 34.7s cold. Small, noisy sample; this config is how it gets tested.
#
# DFlash accelerates DECODE ONLY. Prefill is already fully parallel — every
# input token is known, so there is nothing to speculate about. Expect ~600 T/s
# prefill unchanged.
network:
  host: 0.0.0.0
  port: 5000
  disable_auth: true

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: /home/dushyant30suthar/.lmstudio/models/turboderp
  model_name: Qwen3.6-27B-exl3-6.00bpw

  cache_size: 131072
  max_seq_len: 131072
  cache_mode: 6,4

  max_batch_size: 1
  tensor_parallel: true
  gpu_split_auto: true
  autosplit_reserve: [512, 512]
  chunk_size: 2048
  output_chunking: false

  vision: false
  reasoning: true
  tool_format: qwen3_coder

draft_model:
  # `model`, not `mtp`: loads a separate drafter instead of the MTP head baked
  # into the weights. They are alternatives, never both. DFlash is then
  # auto-detected — generator.py:255 reads caps["dflash_draft"] off the drafter.
  draft_mode: model
  draft_model_dir: /home/dushyant30suthar/.lmstudio/models/turboderp
  draft_model_name: Qwen3.6-27B-DFlash-exl3-6.00bpw
  draft_cache_mode: FP16
  # 2026-08-01: was unset, which was WRONG on two counts. Unset takes the
  # drafter's default_draft_size = block_size - 1 = 15 (architecture/dflash.py:174),
  # and that value is ALSO the cache's max_history (tabbyAPI model.py:506) — so
  # it maximised both the wasted drafting and the GDN state.
  #
  # The drafter does run at its fixed 16-token block, but the generator
  # truncates the block to this window: "the diffusion drafter always runs at
  # its fixed block size, dynamic window truncates the drafted block"
  # (generator.py:653), with num_draft_tokens as the ceiling (generator.py:91).
  #
  # 4 because the upstream thread on this exact drafter reports that starting at
  # 2-4 speculative tokens rather than 15 "dramatically improved acceptance
  # rates and actual throughput"
  # (huggingface.co/z-lab/Qwen3.6-27B-DFlash/discussions/2).
  #
  # Measured at 15 on this box, 1 slot, 8 requests: acceptance 15.5% mean,
  # decode median 31.6 T/s, 16,792 draft tokens spent for 3,464 emitted. For
  # reference MTP single-stream is ~70 T/s. Acceptance also fell with depth —
  # 26% at 556 ctx down to 8.6% at 65k — which points at conditioning drift from
  # the 6-bit weights rather than draft length, so this may not rescue it.
  #
  # Side effect worth knowing: max_history 4 drops GDN state from 2.39 to 0.70
  # GiB per slot, the same as MTP — so 4 slots become affordable again at this
  # setting. Left at 1 slot here ON PURPOSE so this run differs from the last
  # one by draft length alone.
  draft_num_tokens: 4

sampling:
  override_preset: safe_defaults

memory:
  sysmem_recurrent_cache: 4096
  cuda_malloc_async: true
