# Qwen3.8-27B EXL3 6.00bpw. 21.4 GiB weights, 2x RTX 5060 Ti.
#
# One file per model. The panel lists this directory; picking a model relaunches
# TabbyAPI against that file. TabbyAPI holds exactly one model per process, and
# the relaunch is not incidental — exllamav3 does not return VRAM to the driver
# on unload, so killing the process is what reclaims it.
#
# Same qwen3_5 hybrid architecture as the Qwen3.6-27B builds the box already
# runs: 16 full-attention layers (Gated Attention) + 48 gated-deltanet linear
# layers with fixed-size recurrent state, 4 KV heads @ 256. KV cost per token
# is therefore identical to Qwen3.6 — the 6.00bpw/6,4 settings carry straight
# over. What changed is the weight footprint: 6.00bpw is +2.84 GiB vs the
# 5.00bpw build, and the cache has to give that back.
#
# That trade was already measured on this box (Qwen3.6, exllamav3 v1.3.0,
# engine-side `Generate:` metric, 4 reps after discarded warmup):
#     depth    5.00bpw   6.00bpw   delta
#      4k       75.3      69.2     -8.1%
#     32k       74.3      69.7     -6.2%
#     98k       58.1      53.4     -8.1%
# 6.00bpw also holds ~150k fewer tokens of resident context (weights ate the
# KV budget). Fidelity runs the other way: 6.00bpw mean KLD 0.013 vs 5.00bpw
# 0.035 against the unquantised reference (noise floor 0.0102).
#
# Qwen3.8-27B is a native VLM — but the exl3 quants ship the vision tower
# ignored (same as the Qwen3.6 builds), so `vision: false` below is text-only.
# Reasoning/tool/thinking templates are the qwen3_coder family, unchanged from
# Qwen3.6; `reasoning_effort` / `preserve_thinking` are request-level and pass
# through the same template vars.

network:
  host: 0.0.0.0
  port: 5000
  disable_auth: true

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false
  log_chat_completion_requests: false

model:
  model_dir: /home/dushyant30suthar/.lmstudio/models/turboderp
  model_name: Qwen3.8-27B-exl3-6.00bpw

  # pool > per-request length is the point: main agent + subagents coexist
  cache_size: 230400
  # Native 256k. 6,4 KV = 20 KiB/token → 225280 pool ≈ 4.4 GiB (vs 5.0 GiB at
  # 256k). Deep prefills peak +2 GiB over idle; if VRAM dips under ~1.5 GiB
  # free, back cache_size off to 196608 (192k) or 147456.
  max_seq_len: 262144
  # K6/V4 = 20 KiB/token. exllamav3 dequants inside the attention kernel at no
  # latency cost, so FEWER KV bits is FASTER: 6,4 beat Q8 by +7.7% @98k and
  # +9.3% @131k with acceptance matched. 4,4 rejected — loses at 131k and
  # quantises keys, the sensitive half. Do not carry KV settings from llama.cpp.
  cache_mode: 8,8  # PRODUCTION: max-fidelity KV at native 262144 (tighter headroom). 6,4 candidate under test in the -kvtest profile.

  max_batch_size: 1
  tensor_parallel: true
  gpu_split_auto: false
  gpu_split: [14.4, 16.0]
  autosplit_reserve: [512, 512]
  # 1024/2048/4096 = 531/548/553 t/s. 4096's +0.9% costs 320 MB of OOM margin,
  # and margin is scarce: a deep prefill peaks +2 GiB over idle and the CUDA
  # allocator keeps it. 6bpw leaves less headroom than 5bpw did, so start at
  # 1024 and only raise if a long prefill still fits.
  chunk_size: 2048
  # one SSE event per token so bench harnesses can count decode exactly
  output_chunking: false

  vision: false
  reasoning: true
  # Qwen3-Coder XML tool calls stream through as plain text without this, and
  # clients render raw tool_call blocks instead of executing them
  tool_format: qwen3_coder
  # carry thinking blocks forward across agent turns. Same fix as llama.cpp's
  # reasoning-preserve: without it, the model loops/repeats tool calls because
  # its earlier reasoning is stripped from history. Forced so the client cannot
  # turn it back off.
  template_vars_force:
    preserve_thinking: true

draft_model:
  draft_mode: mtp
  draft_model_dir: /home/dushyant30suthar/.lmstudio/models/turboderp
  # blank on purpose: draft_mode mtp with no name uses the MTP head baked into
  # the weights (39 mtp.* tensors). /v1/model reports `draft: null` either way —
  # that is NOT evidence MTP is off; check the log for "Using main model MTP
  # component".
  draft_model_name:
  draft_cache_mode: FP16
  # 2 -> -28% @4k; 6 -> -33% (acceptance collapses 72% -> 59%). 4 is the
  # measured peak on the Qwen3.6 build; re-measure after first boot.
  draft_num_tokens: 4
  # confidence-calibrated truncation: stop drafting once acceptance collapses
  # (deep context), fall back to plain decode instead of wasting draft forwards.
  # Keeps the shallow-context 2-4x speedup.
  dynamic_draft: true

sampling:
  override_preset: qwen38_thinking

memory:
  # GDN recurrent-state checkpoints in host RAM (MB). 8192 forced 24 GB into
  # zram swap on this 31 GB box; 4096 is the working value.
  sysmem_recurrent_cache: 4096
  cuda_malloc_async: true