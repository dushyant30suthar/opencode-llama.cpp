# nvidia/Qwen3.6-35B-A3B-NVFP4 - MoE (A3B), NVIDIA ModelOpt, vision-capable.
#
# NO MTP ON THIS MODEL, deliberately, unlike the 27B. Measured here:
#     baseline (no MTP)   142 t/s
#     MTP k=3             143.7 / 134.0 t/s, mean acceptance length 3.53
# Acceptance is high but speed does not move, because MTP wins by cutting weight
# reads per token and this MoE already reads only ~3B active params - there is
# nothing to amortise. It also costs pool (301,111 vs 413,484). The dense 27B
# gets 2.2x from MTP precisely because it is memory-bound; this is not.
#
# max-num-batched-tokens MUST be >= 2096 on this model. Mamba 'align' mode (which
# prefix caching turns on) computes a 2096-token page here, and vLLM asserts
# block_size <= max_num_batched_tokens:
#     AssertionError: In Mamba cache align mode, block_size (2096) must be
#     <= max_num_batched_tokens (2048)
# 2048 works on the 27B (page 1600) but is 48 tokens too small here. 4096 is the
# next safe step - proven at depth on the 27B, where 8192 is what OOMs.
#
# max-num-seqs 8, down from 64: activation memory scales with it and comes out of
# the KV pool. Cutting it MORE than paid for prefix caching -
#     pool 413,484 (old config) -> 469,178, concurrency 3.18x at 147,456
# which is what makes parent+subagent fan-out comfortable on this model.

model: /home/dushyant30suthar/.lmstudio/models/nvidia/Qwen3.6-35B-A3B-NVFP4
served-model-name: Qwen3.6-35B-A3B-NVFP4

tensor-parallel-size: 2
kv-cache-dtype: fp8
max-model-len: 196608
max-num-seqs: 8
max-num-batched-tokens: 4096
gpu-memory-utilization: 0.955

enable-prefix-caching: true
async-scheduling: true

enable-auto-tool-choice: true
tool-call-parser: qwen3_xml
reasoning-parser: qwen3
