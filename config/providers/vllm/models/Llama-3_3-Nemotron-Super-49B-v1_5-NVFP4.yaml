# nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4 — 28.96 GiB, DENSE.
#
# The dense counterweight to Qwen3.6-35B-A3B-NVFP4. Different lab lineage
# (Llama-3.3-70B put through NVIDIA's NAS pruning, arch DeciLMForCausalLM with
# heterogeneous layers — some attention-free), different failure modes.
#
# THIS FILE IS TIGHT AND THAT IS THE POINT. 28.96 GiB of weights on 31.86 GiB
# leaves ~2-3 GiB for everything else, against the 35B MoE's ~9 GiB. Expect a
# short window. It was pulled knowing that: the question it answers is whether
# a 49B dense is worth trading context for on this box, and that cannot be
# settled by arithmetic.
#
# SOURCE: NVIDIA's model card vLLM section, adapted. Their invocation:
#     --trust-remote-code --seed=1 --tensor-parallel-size=8
#     --max-model-len=65536 --gpu-memory-utilization 0.95 --enforce-eager
# on 1x B200. Deviations here are forced by 2x16 GiB and are noted inline.
#
# enforce-eager IS NOT OPTIONAL HERE, and note NVIDIA uses it even on a B200.
# CUDA graph capture allocates AFTER the KV cache is sized, so on this box it is
# exactly the thing that would OOM late — the failure mode already seen twice
# with the 35B. Skipping capture costs decode speed and buys the memory back as
# context, which is the right trade when context is the scarce thing.
#
# max-model-len IS A PROBE VALUE. 8192 is deliberately far below anything
# useful: it guarantees KV sizing succeeds so the engine will PRINT the real
# pool ("GPU KV cache size: N tokens"), which is the number this whole exercise
# is after. Raise it to what the log reports, then relaunch. Do not guess it up
# — vLLM refuses to start when max-model-len exceeds what the pool can hold.

model: /home/dushyant30suthar/.lmstudio/models/nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4
served-model-name: Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4

# 28.96 GiB cannot sit on one 16 GiB card. Same x4-slot all-reduce tax as every
# other TP model here.
tensor-parallel-size: 2

max-model-len: 8192

# 0.96, against NVIDIA's 0.95. Every 0.01 is ~163 MiB per card and this model
# has nothing to spare; the box is headless (GPU0 2 MiB / GPU1 12 MiB at rest)
# so the reserve does not need to cover a display. With enforce-eager on, the
# late-OOM risk that normally punishes a high value is largely removed.
gpu-memory-utilization: 0.96

# See header. Required on this hardware, not a tuning preference.
enforce-eager: true

kv-cache-dtype: fp8

# Dense Llama-derived: no Mamba blocks, so the 35B's max_num_seqs ceiling does
# not apply here. Kept low anyway because per-sequence activation memory is
# competing with a KV pool that has almost nothing in it.
max-num-seqs: 4

trust-remote-code: true
seed: 1

# TOOL CALLING ships WITH the checkpoint — NVIDIA provides its own parser as a
# plugin file rather than one built into vLLM. No built-in substitutes: the
# format is XML (<tool_call><tool>name</tool><key>value</key></tool_call>), not
# the Llama-3 JSON that `llama3_json` parses.
#
# THE PLUGIN PATH IS A PATCHED COPY, NOT THE CHECKPOINT'S OWN FILE. NVIDIA's
# file targets vllm==0.9.2 (the version its model card pins) and fails outright
# on 0.26:
#     ModuleNotFoundError: No module named 'vllm.entrypoints.openai.protocol'
#     -> KeyError: invalid tool call parser: llama_nemotron_json
# 0.26 split that module and renamed AnyTokenizer. Only the import block needed
# changing; the parsing logic is NVIDIA's, untouched. Patched at
# ~/Projects/vllm/parsers/ so the checkpoint stays pristine and a re-download
# cannot silently revert the fix. Regenerate with scripts/patch_nemotron_parser.py
# if vLLM moves these modules again.
#
# NOTE the upstream filename says "_no_streaming": tool calls do not stream
# incrementally. If opencode shows tool calls only on completion, that is why.
tool-parser-plugin: /home/dushyant30suthar/Projects/vllm/parsers/llama_nemotron_toolcall_parser.py
tool-call-parser: llama_nemotron_json
enable-auto-tool-choice: true

# NO reasoning-parser, deliberately. NVIDIA's recipe sets none: this model
# controls reasoning through the system prompt (empty = reasoning ON, "/no_think"
# = OFF) rather than through a parseable wrapper vLLM knows. vLLM does register a
# `nemotron_v3` parser, but that is for the Nemotron-3 NemotronH family, not this
# Llama-3.3-derived v1.5 — pointing it here would mis-parse.
# If testing shows plain <think></think> tags in the output, `deepseek_r1` is the
# generic parser for that shape and would be the thing to try.
