# ComfyUI settings for opencode-localhost.
# Changing anything here restarts the server.
#
# Mirrored in ~/Projects/opencode-llama.cpp/config/providers/comfyui/server.ini
# — edit one, copy to the other.
#
#   bin         python with torch importable. REQUIRED. The ComfyUI venv:
#               torch 2.13.0+cu130 + sageattention 2.2.0 (built by hand, NOT
#               in requirements.txt). Do not let pip/uv upgrade torch: 2.14 is
#               reported up to 4x slower on H3 (ComfyUI #16150).
#   comfy-dir   the ComfyUI checkout. Branch h3-v0.46.2 (ComfyUI v0.46.2 +
#               our H3 tooling). Rollback: git checkout h3-2gpu-v0.30.1 and
#               uv pip install -r .upgrade-backup/venv-freeze-v0.30.1-20261122.txt
#   models-dir  panel listing only; ComfyUI reads <comfy-dir>/models itself
#   remote      another machine's ComfyUI (host:port); nothing starts locally
#   host        127.0.0.1 = this machine only; 0.0.0.0 = LAN (--listen)
#   port        8188 is the panel's. Benchmarks use 8191-8193, never this one
#   args        passed to main.py verbatim
#
# Why these args (2x RTX 5060 Ti 16 GB, sm_120, 31 GB RAM, no P2P):
#   --use-sage-attention   ~3x faster attention on H3. Verify after any
#                          upgrade: the log must say "Using sage attention"
#   --fast                 measured win on 2026-08-04 (37 runs). Note it now
#                          also enables fp16_accumulation; if you ever see
#                          banding/noise, try `--fast cublas_ops autotune`
#   --disable-product-tips console noise only
#
# Flags that were MEASURED and rejected — do not re-add:
#   --reserve-vram       0.8-1.3% effect, noise (OPEN-LEVERS closed list)
#   --novram, --high-ram, --highvram   froze the box once (hard reset)
#   --cuda-device 0      only if a coding model needs cuda:1; it disables the
#                        H3PipelineSplit node
#
# v0.46.2 notes (2026-11-22):
#   * pinned host memory defaults to ~15.6 GB now (was 28.8 GB of 31 GB on
#     v0.30.1), which relieves the swap pressure seen with H3
#   * the allocator is torch's native one (was cudaMallocAsync), so
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True now actually applies —
#     but this ini cannot set env vars; bench/produce.sh sets it for batches
#   * H3PipelineSplit "cuda:1 vbar OOM while rebinding" on the 2nd sampler /
#     2nd prompt is FIXED (placement is idempotent). The split is still ~11%
#     slower than one GPU; use it for VRAM headroom, not speed

# 2026-11-22: ComfyUI now runs as TWO systemd user services, one per GPU:
#   comfyui-gpu@0 -> cuda:0 on 127.0.0.1:8188    comfyui-gpu@1 -> cuda:1 on 127.0.0.1:8189
#   unit: ~/.config/systemd/user/comfyui-gpu@.service  (flags + measurements are there)
#   logs: ~/.local/state/opencode/providers/comfyui/gpu0.log, gpu1.log
#   control: systemctl --user {start,stop,restart,status} comfyui-gpu@0 comfyui-gpu@1
# The panel only WATCHES gpu0 through `remote` below; it no longer starts ComfyUI.
# To go back to panel-managed single server: stop + disable both units, clear `remote`.

[server]
bin = ~/Projects/comfyui/.venv/bin/python
comfy-dir = ~/Projects/comfyui
models-dir = ~/Projects/comfyui/models
remote = 127.0.0.1:8188
host = 127.0.0.1
port = 8188
args = --use-sage-attention --fast --disable-product-tips
